<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

    <!-- Sidebar -->

    <div class="col-md-2 sidebar">

        <h3 class="text-center mt-4">E-Shop</h3>

        <hr>

        <a href="dashboard.html" class="active">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>

        <a href="products.html">
            <i class="bi bi-box-seam me-2"></i> Products
        </a>

        <a href="users.html">
            <i class="bi bi-people me-2"></i> Users
        </a>

        <a href="orders.html">
            <i class="bi bi-bag-check me-2"></i> Orders
        </a>

        <a href="../index.html">
            <i class="bi bi-house me-2"></i> Home
        </a>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <h2 class="fw-bold mb-1">Dashboard</h2>

        <p class="text-muted mb-4">
            Welcome back, Admin 👋
        </p>

        <!-- Dashboard Cards -->

        <div class="row">

            <!-- Users -->

            <div class="col-lg-3 col-md-6 mb-4">

                <div class="dashboard-card">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5>Total Users</h5>

                            <h2 id="usersCount">0</h2>

                        </div>

                        <div class="icon-box bg-primary-subtle">

                            <i class="bi bi-people-fill text-primary"></i>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Products -->

            <div class="col-lg-3 col-md-6 mb-4">

                <div class="dashboard-card">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5>Total Products</h5>

                            <h2 id="productsCount">0</h2>

                        </div>

                        <div class="icon-box bg-success-subtle">

                            <i class="bi bi-box-seam text-success"></i>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Orders -->

            <div class="col-lg-3 col-md-6 mb-4">

                <div class="dashboard-card">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5>Total Orders</h5>

                            <h2 id="ordersCount">0</h2>

                        </div>

                        <div class="icon-box bg-warning-subtle">

                            <i class="bi bi-cart-check text-warning"></i>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Revenue -->

            <div class="col-lg-3 col-md-6 mb-4">

                <div class="dashboard-card">

    <div class="d-flex align-items-center">

        <div class="flex-grow-1">

            <h5>Total Revenue</h5>

            <h2 id="revenue">₹0</h2>

        </div>

        <div class="icon-box bg-danger-subtle ms-3">

            <i class="bi bi-wallet2 text-danger"></i>

        </div>

    </div>

</div>

            </div>

        </div>

        <!-- Charts -->

        <div class="row">

            <div class="col-lg-8 mb-4">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <h5 class="mb-0">Revenue Overview</h5>

                    </div>

                    <div class="card-body">

                        <canvas id="salesChart" height="120"></canvas>

                    </div>

                </div>

            </div>

            <div class="col-lg-4 mb-4">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <h5 class="mb-0">Order Status</h5>

                    </div>

                    <div class="card-body">

                        <canvas id="orderChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

        <!-- Recent Orders -->

        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">Recent Orders</h5>

            </div>

            <div class="card-body">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                        <tr>

                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Status</th>
                            <th>Amount</th>

                        </tr>

                    </thead>

                    <tbody id="recentOrders">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/auth-check.js"></script>
<script src="js/admin.js"></script>
</body>

</html>
